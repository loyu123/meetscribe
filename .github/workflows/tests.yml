# D2：CI —— 后端最小测试集（无需 GPU/模型，约 30s）
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test deps
        run: pip install -r backend/requirements-dev.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -q

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install & build
        working-directory: web
        run: |
          npm ci
          npm run build

  # 2.2 依赖安全扫描：高危/已知 CVE 阻断合并。
  # 说明：CI 环境只装测试链路依赖（无 torch/funasr 等 GPU 运行时依赖），
  # 全量审计可在有网环境执行：pip-audit -r backend/requirements.txt
  deps-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps + pip-audit
        run: |
          python -m pip install -U pip setuptools
          pip install -r backend/requirements-dev.txt pip-audit
      - name: pip-audit (strict)
        run: pip-audit --strict
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm audit (high+)
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
